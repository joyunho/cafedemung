<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>카페드멍 재고체크</title>
<meta name="description" content="카페드멍 재고를 사장님과 직원이 같은 숫자로 함께 적는 앱">
<meta name="theme-color" content="#f3f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141917" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="재고체크">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=Jua&display=swap">
<style>
/* 레이아웃: 폰 우선 단일 열. 제목 줄은 스크롤되어 사라지고, 보기 전환(입력/한눈에)·검색·구역 탭 바만 상단에 고정된다.
   "입력"은 항목마다 안뜯은거/뜯은거 스테퍼, "한눈에"는 주문 목록과 구역별 압축 표. */
:root{
  --bg:#f3f5f0; --surface:#ffffff; --surface-2:#e9ede4; --ink:#1c221e; --muted:#66706a; --line:#d6dcd3;
  --accent:#2c6b49; --accent-ink:#ffffff; --accent-soft:#deeee4;
  --warn:#8e5f0b; --warn-soft:#f6ead0; --crit:#b03527; --crit-soft:#f8ded9; --focus:#2c6b49;
  --shadow:0 1px 2px rgba(22,32,26,.06), 0 6px 18px rgba(22,32,26,.06);
  --font-display:'Jua','IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --font-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --radius:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141917; --surface:#1c2320; --surface-2:#252d29; --ink:#e6eae4; --muted:#97a29a; --line:#313b35;
    --accent:#7fcd9d; --accent-ink:#0f2a1c; --accent-soft:#213a2c;
    --warn:#e6b85c; --warn-soft:#3a3016; --crit:#f2907f; --crit-soft:#432019; --focus:#7fcd9d;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px);overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
[hidden]{display:none!important}
.wrap{max-width:720px;margin-inline:auto;padding-inline:16px;padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}

/* ---- 제목 줄 ---- */
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 4px}
.brand h1{font-family:var(--font-display);font-weight:400;font-size:28px;letter-spacing:.01em;color:var(--accent);line-height:1.1}
.brand .right{display:flex;align-items:center;gap:8px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-state="ok"]::before{background:var(--accent)}
.sync[data-state="sending"]::before,.sync[data-state="retry"]::before,.sync[data-state="offline"]::before{background:var(--warn)}
.sync[data-state="error"]::before{background:var(--crit)}
.iconbtn{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;padding:0}
.iconbtn svg{width:20px;height:20px}
.summary{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;padding-block:2px 10px;font-variant-numeric:tabular-nums;min-height:22px}
.summary b{color:var(--ink);font-weight:500}
.summary .s-none{color:var(--crit)}
.summary .s-warn{color:var(--warn)}

/* ---- 고정 바 ---- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding-inline:16px;padding-block:6px 0;box-shadow:0 1px 0 var(--line)}
.tools{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px;flex:none}
.seg button{height:34px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-weight:500;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;height:40px;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:0 14px 0 36px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.chip{height:40px;padding:0 13px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font-size:14px;text-decoration:none}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.icon{width:40px;padding:0;justify-content:center;flex:none}
.chip svg{width:17px;height:17px}
.tabs{display:flex;gap:2px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;height:42px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);font-weight:500;white-space:nowrap;border-radius:6px 6px 0 0}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button .n{font-size:12px;font-weight:400;margin-left:4px;font-variant-numeric:tabular-nums}

/* ---- 입력 목록 ---- */
main{min-width:0}
.group{margin-top:18px}
.group h2{font-size:13.5px;font-weight:600;color:var(--muted);letter-spacing:.02em;display:flex;align-items:baseline;gap:8px;padding:0 4px 6px}
.group h2 .n{font-weight:400;font-variant-numeric:tabular-nums}
.group h2 .bad{color:var(--crit);font-weight:500}
.group ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"head counters" "note counters";gap:4px 12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);scroll-margin-top:170px}
.item:first-child{border-top:0}
.item.s-none{box-shadow:inset 4px 0 0 var(--crit)}
.item.s-last,.item.s-low{box-shadow:inset 4px 0 0 var(--warn)}
.item.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:transparent}}
.head{grid-area:head;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.name{border:0;background:transparent;padding:4px 0;text-align:left;font-weight:500;font-size:15.5px;min-width:0;max-width:100%;overflow-wrap:anywhere;border-radius:6px}
.name::after{content:"";display:inline-block;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(-45deg);margin-left:7px;opacity:.7;vertical-align:middle}
.tag{font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.s-none{background:var(--crit-soft);color:var(--crit)}
.tag.s-last,.tag.s-low{background:var(--warn-soft);color:var(--warn)}
.meta{flex-basis:100%;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.note{grid-area:note;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.note::before{content:"메모 ";opacity:.7}
.counters{grid-area:counters;display:flex;gap:8px}
.counter{display:flex;flex-direction:column;align-items:center;gap:2px}
.counter .lbl{font-size:11px;color:var(--muted);letter-spacing:.02em}
.stepper{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);overflow:hidden}
.stepper button{width:40px;height:42px;border:0;background:transparent;font-size:20px;line-height:1;color:var(--ink)}
.stepper button:active{background:var(--accent-soft)}
.stepper input{width:48px;height:42px;border:0;border-inline:1px solid var(--line);background:var(--surface);text-align:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;padding:0;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input::placeholder{color:var(--muted);font-weight:400}
.stepper input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--focus)}
@media (max-width:480px){
  .item{grid-template-columns:1fr;grid-template-areas:"head" "counters" "note";gap:6px}
  .counters{justify-content:space-between}
  .counter{flex:1}
  .stepper{width:100%;justify-content:center}
  .stepper input{flex:1;max-width:none}
}
.addrow{margin-top:14px;display:flex;justify-content:center}
.addrow button{height:44px;padding:0 18px;border:1px dashed var(--line);border-radius:999px;background:transparent;color:var(--accent);font-weight:500}
.empty{margin-top:28px;padding:28px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.empty h3{font-size:16px;color:var(--ink);margin-bottom:6px}
.banner{margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.banner.info{background:var(--accent-soft);color:var(--accent)}
.banner .grow{flex:1;min-width:180px}
.banner .btn{height:34px;padding:0 12px;border-color:transparent;background:var(--surface);color:var(--ink);font-size:13px}

/* ---- 한눈에 (표) ---- */
.card{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.card .hd h2{font-size:15px;font-weight:600}
.card .hd .sub{font-size:12.5px;color:var(--muted);font-weight:400;margin-left:6px}
.card .hd .btn{height:32px;padding:0 12px;font-size:13px}
.orders{margin:0;padding:6px 14px 10px;list-style:none;columns:2;column-gap:18px}
@media (max-width:420px){.orders{columns:1}}
.orders li{break-inside:avoid;padding:5px 0;font-size:14px;display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line)}
.orders li:last-child{border-bottom:0}
.orders .sec{font-size:11.5px;color:var(--muted);display:block}
.orders .st{font-size:12px;font-weight:600;white-space:nowrap}
.orders .st.s-none{color:var(--crit)}
.orders .st.s-last,.orders .st.s-low{color:var(--warn)}
.orders .ok{padding:10px 0;color:var(--muted);font-size:14px}
.tsec{margin-top:18px}
.tsec h2{font-size:14px;font-weight:600;color:var(--muted);padding:0 4px 6px;display:flex;gap:8px;align-items:baseline}
.tsec h2 .n{font-weight:400;font-variant-numeric:tabular-nums}
.grid{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);font-size:14px;table-layout:fixed}
.grid th,.grid td{padding:7px 8px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
.grid th{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em;background:var(--surface-2);border-top:0}
.grid th.n,.grid td.n{text-align:right;font-variant-numeric:tabular-nums;width:56px}
.grid td.n{font-weight:600;font-size:15px}
.grid td.n.blank{color:var(--muted);font-weight:400}
.grid th.m,.grid td.m{width:92px;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid tr.grp td{background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:600;padding:4px 8px}
.grid tr.row{cursor:pointer}
.grid tr.row:active td{background:var(--accent-soft)}
.grid tr.s-none td:first-child{box-shadow:inset 4px 0 0 var(--crit)}
.grid tr.s-last td:first-child,.grid tr.s-low td:first-child{box-shadow:inset 4px 0 0 var(--warn)}
.grid td .nm{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid td .tag{margin-left:0;font-size:10.5px;padding:1px 6px}
.grid td.n.s-none{color:var(--crit)}
.grid td.n.s-last,.grid td.n.s-low{color:var(--warn)}
@media (max-width:420px){.grid th.m,.grid td.m{width:70px}}

/* ---- 시작 / 바텀 시트 ---- */
.setup{min-height:60vh;display:flex;align-items:center;justify-content:center;padding-block:20px}
.cardbox{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:22px 20px}
.cardbox h2{font-family:var(--font-display);font-weight:400;font-size:24px;color:var(--accent);margin-bottom:4px}
.cardbox p{margin:0 0 16px;color:var(--muted);font-size:14px}
.err{color:var(--crit);font-size:13.5px;margin:-4px 0 12px}
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:720px;margin-inline:auto;background:var(--surface);color:var(--ink);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.18);max-height:90vh;overflow:auto}
.sheet h3{font-size:17px;margin-bottom:12px}
.sheet h4{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.02em;margin:16px 0 8px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field span{font-size:12.5px;color:var(--muted)}
.field input,.field select{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.actions .spacer{flex:1}
.btn{height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--crit);border-color:transparent;background:transparent}
.btn.danger.solid{background:var(--crit);color:var(--surface);border-color:var(--crit)}
.btn.wide{width:100%}
.btn.sm{height:38px;font-size:14px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 auto}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:.08em;font-weight:600;padding:10px 12px;background:var(--bg);border:1px dashed var(--line);border-radius:10px;text-align:center;user-select:all}
.hint{font-size:12.5px;color:var(--muted);margin:4px 0 10px}
.confirm{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--crit-soft);color:var(--crit);display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.confirm .btn{height:36px}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:rise .18s ease-out}
  @keyframes rise{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
}
@media (prefers-reduced-motion:reduce){.item.flash{animation:none;background:var(--accent-soft)}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand">
    <h1>카페드멍 재고체크</h1>
    <div class="right">
      <span class="sync" id="sync" data-state="connecting" hidden>연결 중…</span>
      <button class="iconbtn" id="gearBtn" type="button" title="설정 · 연결" aria-label="설정" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </header>

  <section class="setup" id="setup" hidden>
    <form class="cardbox" id="setupForm" autocomplete="off">
      <h2 id="setupTitle">처음 설정</h2>
      <p id="setupIntro">이름만 넣으면 바로 시작돼요. 재고 목록은 기존 시트에서 옮겨 둔 108개가 들어 있어요.</p>
      <label class="field"><span>내 이름 (누가 고쳤는지 표시돼요)</span><input id="s-name" maxlength="20" placeholder="예: 윤호"></label>
      <label class="field" id="f-code"><span>가게 코드 (사장님 폰에 이미 있으면 그 코드)</span><input id="s-code" autocapitalize="characters" autocomplete="off" placeholder="비워두면 새로 만들어요"></label>
      <p class="err" id="s-err" hidden></p>
      <button type="submit" class="btn primary wide" id="s-go">시작하기</button>
    </form>
  </section>

  <div id="app" hidden>
    <div class="summary" id="summary"></div>
    <div class="banner info" id="pairHint" hidden>
      <span class="grow">사장님 폰과 아직 연결되지 않았어요. 연결 링크를 보내면 같은 숫자를 함께 봅니다.</span>
      <button class="btn" id="pairShareBtn" type="button">연결 링크 보내기</button>
      <button class="btn" id="pairClose" type="button">닫기</button>
    </div>
    <div class="banner info" id="install" hidden>
      <span class="grow" id="installText"></span>
      <button class="btn" id="installBtn" type="button" hidden>설치</button>
      <button class="btn" id="installClose" type="button">닫기</button>
    </div>

    <div class="bar">
      <div class="tools">
        <div class="seg" role="tablist" aria-label="보기">
          <button type="button" role="tab" id="viewList" data-view="list" aria-selected="true">입력</button>
          <button type="button" role="tab" id="viewTable" data-view="table" aria-selected="false">한눈에</button>
        </div>
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="q" placeholder="검색" autocomplete="off" aria-label="항목 검색">
        </label>

  function renderList() {

  // ---------- 그리기: 한눈에 ----------
  function orderList() { return liveItems().filter(d => LOW_KEYS.has(statusOf(d).key)); }
  function orderText() {
    const d = new Date(); const lines = [`카페드멍 주문 목록 (${d.getMonth() + 1}/${d.getDate()})`];
    const groups = groupsOf(orderList(), true);
    let lastSec = '';
    for (const g of groups) { if (g.section !== lastSec) { lines.push(`[${g.section}]`); lastSec = g.section; } for (const it of g.items) { const st = statusOf(it); lines.push(`- ${it.name}: ${st.label} (안뜯 ${fmtNum(num(it.unopened)) || '-'} / 뜯 ${fmtNum(num(it.opened)) || '-'})`); } }

  function renderTable() {
    const root = $('#table');

    if (ol.length) {
      html += '<ul class="orders">' + groupsOf(ol, true).flatMap(g => g.items.map(it => { const st = statusOf(it); return `<li data-id="${esc(it.id)}"><span><span class="nm">${esc(it.name)}</span><span class="sec">${esc(g.section)} · ${esc(g.group)}</span></span><span class="st s-${st.key}">${st.label} <span>${fmtNum(num(it.unopened)) || '–'}/${fmtNum(num(it.opened)) || '–'}</span></span></li>`; })).join('') + '</ul>';
    } else html += '<div class="orders"><div class="ok">부족한 항목이 없어요.</div></div>';
    html += '</div>';
    const secs = sectionsList();
    const all = liveItems().filter(d => matches(d, q) && (!S.low || LOW_KEYS.has(statusOf(d).key)));
    for (const sec of secs) {

        }

  // ---------- 복사 · 공유 · 백업 ----------
  async function copyText(text, okMsg) {
    try { await navigator.clipboard.writeText(text); toast(okMsg || '복사했어요'); return true; }
    catch (e) {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.focus(); ta.select();
      let ok = false; try { ok = document.execCommand('copy'); } catch (x) { ok = false; } ta.remove();
      toast(ok ? (okMsg || '복사했어요') : '복사가 안 돼요. 길게 눌러 직접 복사해 주세요.'); return ok;
    }
  }
  function joinLink() { return APP_URL + '#j=' + S.cfg.code; }
  async function shareLink() {
    const text = `카페드멍 재고체크 앱이에요. 이 링크를 열고 이름만 넣으면 같은 재고 숫자를 함께 볼 수 있어요.\n가게 코드: ${S.cfg.code}`;
    if (navigator.share) { try { await navigator.share({ title: '카페드멍 재고체크', text, url: joinLink() }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
    copyText(text + '\n' + joinLink(), '연결 링크를 복사했어요. 카톡 등으로 보내주세요.');
  }
  function tsvText() {
    const rows = [['구역', '분류', '항목', '안뜯은거', '뜯은거', '메모', '최소수량', '마지막 수정', '수정한 사람']];
    for (const g of groupsOf(liveItems(), true)) for (const d of g.items) rows.push([g.section, g.group, d.name, fmtNum(num(d.unopened)), fmtNum(num(d.opened)), d.note || '', fmtNum(num(d.min)), lastTouched(d) ? new Date(lastTouched(d)).toLocaleString('ko-KR') : '', lastBy(d)]);
    return rows.map(r => r.map(c => String(c).replace(/[\t\n\r]+/g, ' ')).join('\t')).join('\n');
  }
  function backup() {
    const data = JSON.stringify({ app: 'cafedemung', v: 1, at: new Date().toISOString(), code: S.cfg.code, items: Array.from(S.items.values()) }, null, 1);
    const blob = new Blob([data], { type: 'application/json' }); const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `카페드멍-재고-백업-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000); toast('백업 파일을 저장했어요');
  }
  function restore(file) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        const data = JSON.parse(String(fr.result)); if (!data || !Array.isArray(data.items)) throw new Error('bad');
        const n = mergeMany(data.items); for (const r of data.items) if (r && r.id) S.dirty.add(String(r.id));
        S.dirtySinceSnap = true; saveStore(); scheduleDelta(); render(); toast(`백업에서 ${n}개 항목을 반영했어요`);
      } catch (e) { toast('백업 파일을 읽지 못했어요'); }
    };
    fr.readAsText(file);
  }

  // ---------- 입력 이벤트 ----------

    editCounts(id, { [key]: Math.round(n * 10) / 10 });
  });
  list.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target instanceof HTMLInputElement) ev.target.blur(); });
  list.addEventListener('focusin', ev => { if (ev.target instanceof HTMLInputElement) ev.target.select(); });
  $('#tabs').addEventListener('click', ev => { const b = ev.target.closest('button[data-sec]'); if (!b) return; S.cfg.tab = b.dataset.sec; saveCfg(); render(); window.scrollTo({ top: 0 }); });
  $$('.seg button').forEach(b => b.addEventListener('click', () => { S.cfg.view = b.dataset.view; saveCfg(); render(); window.scrollTo({ top: 0 }); }));
  const qInput = $('#q');
  qInput.addEventListener('input', () => { S.q = qInput.value; render(); });
  $('#lowBtn').addEventListener('click', ev => { S.low = !S.low; ev.currentTarget.setAttribute('aria-pressed', String(S.low)); render(); });
  $('#addBtn').addEventListener('click', () => openEditor(null, S.cfg.tab));
  $('#addBtn2').addEventListener('click', () => openEditor(null, S.cfg.tab));

  // ---------- 홈 화면 설치 안내 ----------
  const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let installEvt = null;
  function showInstall(kind) {
    if (standalone || S.cfg.hints.install) return;
    const txt = $('#installText'), btn = $('#installBtn');
    if (kind === 'ios') { txt.textContent = '앱처럼 쓰려면: Safari 아래 공유 버튼 → "홈 화면에 추가"'; btn.hidden = true; }
    else { txt.textContent = '홈 화면에 설치하면 앱처럼 바로 열려요.'; btn.hidden = false; }
    $('#install').hidden = false;
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; showInstall('android'); });
  $('#installBtn').addEventListener('click', async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (e) { /* 무시 */ } installEvt = null; $('#install').hidden = true; });
  $('#installClose').addEventListener('click', () => { S.cfg.hints.install = true; saveCfg(); $('#install').hidden = true; });
  if (isIOS) showInstall('ios');

  // ---------- 시작 ----------
  if ('serviceWorker' in navigator && location.protocol === 'https:') { navigator.serviceWorker.register('./sw.js').catch(() => {}); }
  loadStore();
  if (!S.cfg.deviceId) { S.cfg.deviceId = newId('d'); saveCfg(); }
  const join = pendingJoinCode();
  if (join && join.length === 14 && S.cfg.code && S.cfg.name) {
    clearHash();
    if (join !== S.cfg.code) { startApp(false).then(() => switchCode(join)).then(() => toast('링크의 가게 코드로 연결했어요')); }
    else startApp(false);
  } else if (!S.cfg.code || !S.cfg.name) showSetup(join && join.length === 14 ? join : '');
  else startApp(false);
})();
</script>
</body>
</html>
